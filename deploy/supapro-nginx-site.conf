include /etc/nginx/snippets/supapro-active-upstream.conf;
include /etc/nginx/snippets/supapro-active-assets.conf;

server {
    server_name 201-24-51-103.nip.io supapro.ru www.supapro.ru;

    client_max_body_size 180m;
    include /etc/nginx/snippets/pilot-plus-downloads.conf;

    # Every release gets a distinct public asset URL. The rewrite keeps Next.js
    # serving the files while preventing immutable browser caches from mixing builds.
    location ~ ^/assets/[A-Za-z0-9._-]+/_next/(.*)$ {
        rewrite ^/assets/[A-Za-z0-9._-]+/_next/(.*)$ /_next/$1 break;
        proxy_pass http://supapro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://supapro_backend;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        sub_filter_once off;
        sub_filter '.css"' '.css?dpl=$supapro_asset_version"';
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/supapro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supapro.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name 201-24-51-103.nip.io supapro.ru www.supapro.ru;
    return 301 https://supapro.ru$request_uri;
}
