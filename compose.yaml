name: pilot-plus

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: pilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot

    ports:
      - '5433:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - pilot-network

  redis:
    image: redis:8-alpine
    container_name: pilot-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis-data:/data

    networks:
      - pilot-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pilot-mqtt
    restart: unless-stopped

    ports:
      - '1883:1883'
      - '9001:9001'

    volumes:
      - ./docker/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

    networks:
      - pilot-network

  clamav:
    image: clamav/clamav:1.4
    container_name: pilot-clamav
    restart: unless-stopped

    # Production contract: clamd доступен только сервисам в pilot-network; host port отсутствует.

    volumes:
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-data:/var/lib/clamav

    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --config-file=/etc/clamav/clamd.conf --ping 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - pilot-network

  # One-shot smoke runtime: the application converter itself still spawns this fixed binary locally.
  rental-document-runtime:
    build:
      context: .
      dockerfile: docker/rental-document-runtime/Dockerfile
    profiles: ['rental-documents']
    environment:
      RENTAL_DOCUMENT_CONVERTER_EXECUTABLE: /usr/bin/soffice
      RENTAL_DOCUMENT_CONVERTER_TIMEOUT_MS: '45000'
      RENTAL_DOCUMENT_MAX_BYTES: '15728640'
      RUN_RENTAL_DOCUMENT_CONVERTER_INTEGRATION: '1'
    tmpfs:
      - /tmp:mode=0700,size=256m

networks:
  pilot-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  clamav-data:
