name: pilot-plus

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: pilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - pilot-network

  redis:
    image: redis:8-alpine
    container_name: pilot-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - pilot-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pilot-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./docker/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

    networks:
      - pilot-network

networks:
  pilot-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log: