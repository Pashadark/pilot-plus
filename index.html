<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>СУПА ПРО — варианты главного экрана</title>
    <style>
      body { margin: 0; padding: 20px; background: #f1f4f5; color: #17211f; font-family: Arial, sans-serif; }
      main { max-width: 1200px; margin: 0 auto; }
      h1 { font-size: 24px; }
      section { margin: 18px 0; padding: 14px; background: white; border-radius: 16px; box-shadow: 0 5px 24px #18342a12; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid #dce4e1; }
      p { color: #64716d; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>СУПА ПРО — главный экран</h1>
      <p>Три схемы для выбора структуры утреннего рабочего экрана.</p>
      <section><h2>A · Командный центр — рекомендация</h2><img src="a.png" alt="Командный центр" /></section>
      <section><h2>B · Финансовый обзор</h2><img src="b.png" alt="Финансовый обзор" /></section>
      <section><h2>C · Сегодня, завтра, послезавтра</h2><img src="c.png" alt="Планирование трёх дней" /></section>
    </main>
  </body>
</html>
