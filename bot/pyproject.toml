[project]
name = "pilot-plus-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.26,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
